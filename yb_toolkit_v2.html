<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yb(III) Crystal-Field Splitting Calculator</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mute:#5c6675;--line:#dfe4ea;--blue:#2f6fed;--red:#d63c2f;--green:#17734a;--orange:#b8501a;--navy:#14213d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header .sub{color:#b9c4d6;font-size:13px}
.layout{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}
aside{display:flex;flex-direction:column;gap:14px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h2,.card h2{margin:0 0 10px;font-size:14px;font-weight:700}
.panel label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
.panel input[type=text],.panel input[type=number],.panel select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff;color:var(--ink)}
.panel input[type=file]{width:100%;font-size:12px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--ink)}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{background:#f0f3f8}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;width:100%;padding:10px;font-size:15px}
button.primary:hover{background:#2560d6}
button:disabled{opacity:.55;cursor:default}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
#status{font-size:13px;padding:8px 10px;border-radius:8px;background:#eef3ff;color:#1c3d8f;min-height:34px}
#status.err{background:#fdecea;color:#9b2018}
main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start}
@media(max-width:1250px){main{grid-template-columns:1fr}}
.card.wide{grid-column:1/-1}
.card svg{width:100%;height:auto;display:block}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.empty{color:var(--mute);font-size:13px;padding:28px 8px;text-align:center}
.toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.legend{font-size:12px;color:var(--mute);margin-top:6px}
.lt td,.lt th{text-align:left;white-space:normal}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}

<body>

<div class="layout">
<aside>
  <div class="panel">
    <h2>1. Files</h2>
    <label>CIF file</label><input type="file" id="cif" accept=".cif,.txt">
    <label>Absorption spectrum CSV (two columns: x, y)</label>
    <div class="row"><input type="file" id="absf" accept=".csv,.txt,.dat"><select id="absUnit" style="max-width:80px"><option value="nm">nm</option><option value="ev">eV</option><option value="cm-1">cm⁻¹</option></select></div>
    <label>Emission spectrum CSV (optional)</label>
    <div class="row"><input type="file" id="emif" accept=".csv,.txt,.dat"><select id="emiUnit" style="max-width:80px"><option value="nm">nm</option><option value="ev">eV</option><option value="cm-1">cm⁻¹</option></select></div>
    <div class="toolbar"><button id="demo" type="button">Load example (thiolfan)</button></div>
    <div class="hint">The example uses the coordinates of SI Table S10 and the energies of Table S11.</div>
  </div>
  <div class="panel">
    <h2>2. Structure</h2>
    <div class="row"><div><label>Coordination cutoff (Å)</label><input type="number" id="cutoff" value="3.0" step="0.1" min="1.5" max="5"></div>
    <div><label>Yb atom</label><select id="ybLabel"></select></div></div>
    <div class="hint">Cl, O, N, S and other donors within the cutoff are found, including atoms generated by symmetry operations.</div>
  </div>
  <div class="panel">
    <h2>3. Target energies</h2>
    <div class="row"><div><label>Peak search lower limit (eV)</label><input type="number" id="wlo" value="1.25" step="0.01"></div><div><label>Upper limit (eV)</label><input type="number" id="whi" value="1.50" step="0.01"></div></div>
    <div class="row"><div><label>Minimum prominence</label><input type="number" id="prom" value="0.05" step="0.01" min="0.005"></div><div><label>Peaks to skip</label><input type="number" id="skip" value="0" min="0" step="1"></div></div>
    <button id="redetect" type="button" style="margin-top:8px;width:100%">Find peaks again</button>
    <div id="peakChips" class="chips"></div>
    <label>E(9,10), E(11,12), E(13,14) − E(1,2) (eV)</label>
    <div class="row"><input type="number" id="t1" step="0.0001" placeholder="E(9,10)"><input type="number" id="t2" step="0.0001" placeholder="E(11,12) optional"><input type="number" id="t3" step="0.0001" placeholder="E(13,14)"></div>
    <div class="hint">Clear a box if that line is not observed or is a hot band (for example E(11,12)). At least two energies are needed.</div>
    <label>Experimental ground splitting E(3,4)−E(1,2) (meV)</label>
    <input type="number" id="gs" step="0.1" placeholder="Filled from emission data, or enter manually">
    <label class="chk"><input type="checkbox" id="useGs" checked> Include ground splitting as a fit target</label>
    <label>ξ spin–orbit constant (cm⁻¹)</label><input type="number" id="xi" value="2870" step="10">
  </div>
  <div class="panel">
    <h2>4. Fitting stages (SI section 4)</h2>
    <label class="chk"><input type="checkbox" id="doSamp" checked> Random charge sampling, ⟨r^k⟩ re-fitted for each sample</label>
    <div class="row"><div><label>Samples</label><input type="number" id="nSamp" value="200" min="10" max="2000" step="10"></div><div><label>Random seed</label><input type="number" id="seed" value="1" min="1" step="1"></div></div>
    <label>Sampling range</label>
    <select id="sampMode"><option value="si">SI rule: −χ/4 ≤ −0.625 e → toward −1 e, others → toward 0 e</option><option value="uniform">Uniform in [−1, 0] e for every charge</option></select>
    <div class="hint">Charges are rescaled after sampling so the total stays −3 e, as in SI Tables S7–S10.</div>
    <label class="chk"><input type="checkbox" id="doRot" checked> Rigid rotation scan (crude 72 points, fine 288 points)</label>
    <div class="hint">Rotating all charges together does not change the energies or the orientation-averaged oscillator strengths, so this scan is reported as a diagnostic: the error spread should be ~0.</div>
  </div>
  <div class="panel">
    <h2>5. 4f–5d mixing (oscillator strength)</h2>
    <label class="chk"><input type="checkbox" id="doOpt" checked> Calculate E1 + M1 oscillator strengths</label>
    <div class="row"><div><label>Measured f for E(9,10)</label><input type="number" id="fMeas" step="any" placeholder="blank = 1e-6 (SI)"></div><div><label>Refractive index n<sub>r</sub></label><input type="number" id="nrO" value="1.406" step="0.001"></div></div>
    <div class="hint">Use the f₁₂ from the Oscillator strength tab. The 5d/4f gap is scanned to match it.</div>
    <label>Temperature for hot bands (K)</label><input type="number" id="tempK" value="300" step="1" min="1">
    <label>⟨4f|r|5d⟩, ⟨4f|r³|5d⟩, ⟨4f|r⁵|5d⟩ (Å, Å³, Å⁵)</label>
    <div class="row"><input type="number" id="rfd1" value="0.10" step="0.01"><input type="number" id="rfd3" value="0.11" step="0.01"><input type="number" id="rfd5" value="0.03" step="0.01"></div>
    <label>5d crystal field ⟨r²⟩, ⟨r⁴⟩ (Å², Å⁴; 0 = degenerate 5d)</label>
    <div class="row"><input type="number" id="r5d2" value="0" step="0.1"><input type="number" id="r5d4" value="0" step="0.1"></div>
    <div class="hint">The radial integrals are rough placeholders, not computed values. Their overall size trades off against the fitted gap, so the gap and 5d % are only meaningful relative to these inputs.</div>
  </div>
  <button id="run" class="primary">Run calculation</button>
  <div id="status">Upload a CIF and an absorption CSV, or load the example.</div>
</aside>
<main>
  <div class="card"><h2>Yb coordination structure (drag to rotate, wheel to zoom)</h2><canvas id="c3d" width="640" height="320"></canvas>
    <div class="legend"><span class="dot" style="background:#14213d"></span>Yb <span class="dot" style="background:#d9541e"></span>O <span class="dot" style="background:#2e9e5b"></span>Cl <span class="dot" style="background:#2f6fed"></span>N <span class="dot" style="background:#d9a21e"></span>S</div>
    <div class="toolbar"><button id="resetView" type="button">Reset view</button><label class="chk" style="margin:0"><input type="checkbox" id="showQ"> Show charges</label></div>
    <div id="donorTable"></div></div>
  <div class="card"><h2>Absorption spectrum and calculated transitions</h2><div id="absPlot"><div class="empty">Shown after you upload an absorption CSV.</div></div></div>
  <div class="card"><h2>Energy levels</h2><div id="levelPlot"><div class="empty">Shown after you run the calculation.</div></div></div>
  <div class="card"><h2>Emission spectrum (ground-splitting check)</h2><div id="emiPlot"><div class="empty">Shown after you upload an emission CSV.</div></div><div id="emiInfo"></div></div>
  <div class="card wide"><h2>Results</h2><div id="results"><div class="empty">Shown after you run the calculation.</div></div></div>
  <div class="card wide"><h2>Fitting stages</h2><div id="stages"><div class="empty">Shown after you run the calculation.</div></div></div>
  <div class="card wide"><h2>Oscillator strengths with 4f–5d mixing (E1 + M1)</h2><div id="optics"><div class="empty">Shown after you run the calculation with oscillator strengths turned on.</div></div></div>
</main>
</div>
<script>
/* ===== SOCF core (port of yb_socf_cif.py) ===== */
const K_COULOMB = 116140.6;          // e^2/(4 pi eps0) in cm^-1 * Angstrom
const CM_PER_MEV = 8.065544;
const H_C_EV_NM = 1239.84198;
const LQ = 3;
const MS = [3, 2, 1, 0, -1, -2, -3];
const ELECTRONEG = { F: 3.98, O: 3.5, N: 3.04, Cl: 3.16, Br: 2.96, I: 2.66, S: 2.58, P: 2.19, C: 2.55 };
const HALIDES = ['F', 'Cl', 'Br', 'I'];
const DONORS = ['O', 'N', 'Cl', 'Br', 'I', 'F', 'S', 'P'];

const FACT = [1];
for (let i = 1; i <= 24; i++) FACT[i] = FACT[i - 1] * i;

/* ---------- spherical harmonics ---------- */
function plm(l, m, x) {               // associated Legendre, Condon-Shortley phase (same as scipy lpmv)
  let pmm = 1;
  if (m > 0) {
    const somx2 = Math.sqrt((1 - x) * (1 + x));
    let fact = 1;
    for (let i = 1; i <= m; i++) { pmm *= -fact * somx2; fact += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = (x * (2 * ll - 1) * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}
function Ykq(k, q, th, ph) {
  if (q < 0) {
    const [r, i] = Ykq(k, -q, th, ph);
    const s = (q % 2 === 0) ? 1 : -1;
    return [s * r, -s * i];
  }
  const n = Math.sqrt((2 * k + 1) / (4 * Math.PI) * FACT[k - q] / FACT[k + q]) * plm(k, q, Math.cos(th));
  return [n * Math.cos(q * ph), n * Math.sin(q * ph)];
}
function Ckq(k, q, th, ph) {
  const [r, i] = Ykq(k, q, th, ph);
  const f = Math.sqrt(4 * Math.PI / (2 * k + 1));
  return [f * r, f * i];
}

/* ---------- Racah tensor matrices <3 m|C_q^k|3 m'> by exact quadrature ---------- */
function gaussLegendre(n) {
  const x = [], w = [];
  for (let i = 0; i < n; i++) {
    let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), pp = 1;
    for (let it = 0; it < 100; it++) {
      let p1 = 1, p2 = 0;
      for (let j = 0; j < n; j++) { const p3 = p2; p2 = p1; p1 = ((2 * j + 1) * z * p2 - j * p3) / (j + 1); }
      pp = n * (z * p1 - p2) / (z * z - 1);
      const z1 = z; z = z1 - p1 / pp;
      if (Math.abs(z - z1) < 1e-15) break;
    }
    // recompute pp at final z
    let p1 = 1, p2 = 0;
    for (let j = 0; j < n; j++) { const p3 = p2; p2 = p1; p1 = ((2 * j + 1) * z * p2 - j * p3) / (j + 1); }
    pp = n * (z * p1 - p2) / (z * z - 1);
    x.push(z); w.push(2 / ((1 - z * z) * pp * pp));
  }
  return { x, w };
}
let GRID = null;
function getGrid() {
  if (GRID) return GRID;
  const NA = 24, NB = 32, gl = gaussLegendre(NA);
  const th = [], ph = [], w = [];
  for (let a = 0; a < NA; a++) for (let b = 0; b < NB; b++) {
    th.push(Math.acos(gl.x[a])); ph.push(2 * Math.PI * b / NB); w.push(gl.w[a] * 2 * Math.PI / NB);
  }
  const Yre = [], Yim = [];
  for (const m of MS) {
    const re = new Float64Array(th.length), im = new Float64Array(th.length);
    for (let p = 0; p < th.length; p++) { const [r, i] = Ykq(LQ, m, th[p], ph[p]); re[p] = r; im[p] = i; }
    Yre.push(re); Yim.push(im);
  }
  GRID = { th, ph, w, Yre, Yim, n: th.length };
  return GRID;
}
const RACAH = {};
function racah(k, q) {
  const key = k + ',' + q;
  if (RACAH[key]) return RACAH[key];
  const g = getGrid();
  const cre = new Float64Array(g.n), cim = new Float64Array(g.n);
  for (let p = 0; p < g.n; p++) { const [r, i] = Ckq(k, q, g.th[p], g.ph[p]); cre[p] = r; cim[p] = i; }
  const re = new Float64Array(49), im = new Float64Array(49);
  for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) {
    let sr = 0, si = 0;
    for (let p = 0; p < g.n; p++) {
      // conj(Y_i) * C * Y_j
      const ar = g.Yre[i][p], ai = -g.Yim[i][p];
      const br = cre[p] * g.Yre[j][p] - cim[p] * g.Yim[j][p];
      const bi = cre[p] * g.Yim[j][p] + cim[p] * g.Yre[j][p];
      sr += g.w[p] * (ar * br - ai * bi);
      si += g.w[p] * (ar * bi + ai * br);
    }
    re[i * 7 + j] = sr; im[i * 7 + j] = si;
  }
  return (RACAH[key] = { re, im });
}

/* ---------- spin-orbit matrix l.s (14x14 real) ---------- */
const LS = (() => {
  const M = new Float64Array(196);
  for (let s = 0; s < 2; s++) for (let mi = 0; mi < 7; mi++) {
    const idx = s * 7 + mi;
    M[idx * 14 + idx] += (s === 0 ? 0.5 : -0.5) * MS[mi];
  }
  for (let mi = 0; mi < 7; mi++) {
    const m = MS[mi];
    if (m < LQ) {
      const c = Math.sqrt(LQ * (LQ + 1) - m * (m + 1));
      const mj = MS.indexOf(m + 1);
      const a = 1 * 7 + mj, b = 0 * 7 + mi;           // <down,m+1| s- l+ |up,m>
      M[a * 14 + b] += 0.5 * c; M[b * 14 + a] += 0.5 * c;
    }
  }
  return M;
})();

/* ---------- crystal field ---------- */
function geometry(xyz) {
  const th = [], ph = [], R = [];
  for (const v of xyz) {
    const r = Math.hypot(v[0], v[1], v[2]);
    R.push(r); th.push(Math.acos(v[2] / r)); ph.push(Math.atan2(v[1], v[0]));
  }
  return { th, ph, R, n: xyz.length };
}
function Akq(geo, Q, k, q) {          // geometric factor of eq. S3 (cm^-1 / Angstrom^k)
  let Ar = 0, Ai = 0;
  for (let i = 0; i < geo.n; i++) {
    const [cr, ci] = Ckq(k, -q, geo.th[i], geo.ph[i]);
    const s = ((q % 2 === 0) ? 1 : -1) * Q[i] / Math.pow(geo.R[i], k + 1);
    Ar += s * cr; Ai += s * ci;
  }
  return [Ar * K_COULOMB, Ai * K_COULOMB];
}
function buildHk(geo, Q) {            // per-k 7x7 complex matrices with <r^k> = 1 (eq. S3, S2)
  const out = [null];
  for (let k = 1; k <= 6; k++) {
    const re = new Float64Array(49), im = new Float64Array(49);
    for (let q = -k; q <= k; q++) {
      const [Ar, Ai] = Akq(geo, Q, k, q);
      const M = racah(k, q);
      for (let t = 0; t < 49; t++) {
        re[t] += Ar * M.re[t] - Ai * M.im[t];
        im[t] += Ar * M.im[t] + Ai * M.re[t];
      }
    }
    out.push({ re, im });
  }
  return out;
}

/* ---------- eigenvalues of a real symmetric matrix (cyclic Jacobi) ---------- */
function jacobiEigenvalues(a, n) {
  for (let sweep = 0; sweep < 60; sweep++) {
    let off = 0;
    for (let p = 0; p < n - 1; p++) for (let q = p + 1; q < n; q++) off += a[p * n + q] * a[p * n + q];
    if (off < 1e-14) break;
    for (let p = 0; p < n - 1; p++) for (let q = p + 1; q < n; q++) {
      const apq = a[p * n + q];
      if (Math.abs(apq) < 1e-300) continue;
      const app = a[p * n + p], aqq = a[q * n + q];
      const theta = (aqq - app) / (2 * apq);
      const t = (theta >= 0 ? 1 : -1) / (Math.abs(theta) + Math.sqrt(theta * theta + 1));
      const c = 1 / Math.sqrt(t * t + 1), s = t * c;
      a[p * n + p] = app - t * apq; a[q * n + q] = aqq + t * apq;
      a[p * n + q] = 0; a[q * n + p] = 0;
      for (let r = 0; r < n; r++) {
        if (r === p || r === q) continue;
        const arp = a[r * n + p], arq = a[r * n + q];
        const np_ = c * arp - s * arq, nq_ = s * arp + c * arq;
        a[r * n + p] = np_; a[p * n + r] = np_;
        a[r * n + q] = nq_; a[q * n + r] = nq_;
      }
    }
  }
  const e = new Float64Array(n);
  for (let i = 0; i < n; i++) e[i] = a[i * n + i];
  return Array.from(e).sort((x, y) => x - y);
}

function eigLevels(Hk, r, xi) {       // r[k] = <r^k>; H = -xi l.s + H_CF ; returns 28 sorted eigenvalues (each level twice)
  return jacobiEigenvalues(buildS(Hk, r, xi), 28);
}
function buildS(Hk, r, xi) {          // 28x28 real embedding [[A,-B],[B,A]] of the 14x14 Hermitian H = A + iB
  const N = 28, S = new Float64Array(N * N);
  const A = new Float64Array(196), B = new Float64Array(196);
  for (let i = 0; i < 196; i++) A[i] = -xi * LS[i];
  for (let s = 0; s < 2; s++) for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) {
    let hr = 0, hi = 0;

/* ---------- run ---------- */
async function run() {

  if (opts.optics && !(opts.optics.rfd[0] > 0 && (opts.optics.rfd[1] > 0 || opts.optics.rfd[2] > 0))) return setStatus('For oscillator strengths, ⟨4f|r|5d⟩ and at least one of ⟨4f|r³|5d⟩, ⟨4f|r⁵|5d⟩ must be positive.', true);
  $('run').disabled = true; setStatus('Fitting…');
  try {
    const xyz = S.env.map(u => u.xyz), els = S.env.map(u => u.el);
    const tn = t.map(v => Number.isFinite(v) ? v : null);
    const g = fitGen(xyz, els, tn, gs, xi, opts); let st;
    while (!(st = g.next()).done) { setStatus('Fitting… ' + st.value); await new Promise(r => setTimeout(r, 0)); }
    S.res = st.value; S.res.targets = tn; S.res.gs = gs;

}

  return s + '<div class="legend"><span class="dot" style="background:#2f6fed"></span>E1 + M1 <span class="dot" style="background:#8a94a3"></span>M1 only <span class="dot" style="background:#7a3fa0"></span>Target <span class="dot" style="background:#d63c2f"></span>Matched gap</div>';
}
function opticsHTML(o) {
  const sci = x => Number.isFinite(x) ? x.toExponential(3) : '—';
  let h = `<div class="hint" style="margin-bottom:8px">Target f for (1,2)→(9,10): <b>${sci(o.fTarget)}</b>${o.targetFromUser ? ' (measured)' : ' (SI default, no measured value entered)'}. Matched 5d/4f gap: <b>${o.gapEV.toFixed(3)} eV</b> (scan ${o.lo.toFixed(2)}–${o.hi} eV). n<sub>r</sub> = ${o.nr}, T = ${o.T} K.</div>`;
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:24px"><div style="min-width:0;overflow-x:auto">';
  h += '<table><tr><th>Initial → final</th><th>Calc. E (eV)</th><th>E1</th><th>M1</th><th>E1 + M1</th><th>with k<sub>B</sub>T</th></tr>';
  o.trans.forEach(t => { h += `<tr${t.I === 0 && t.F === 4 ? ' style="background:#f2f6ff;font-weight:700"' : ''}><td>(${2 * t.I + 1},${2 * t.I + 2}) → (${2 * t.F + 1},${2 * t.F + 2})</td><td>${t.dE_eV.toFixed(4)}</td><td>${sci(t.E1)}</td><td>${sci(t.M1)}</td><td>${sci(t.f)}</td><td>${sci(t.fT)}</td></tr>`; });
  h += '</table><div class="hint">Same layout as SI Table S11. "with k<sub>B</sub>T" multiplies by exp(−ΔE/k<sub>B</sub>T) of the initial doublet relative to (1,2).</div></div><div style="min-width:0;overflow-x:auto">';
  h += gapSVG(o);
  h += '<table style="margin-top:12px"><tr><th>States</th><th>Energy rel. to (1,2) (meV)</th><th>5d mixing (%)</th></tr>';
  for (let i = 0; i < 7; i++) { const e = ((o.E[2 * i] + o.E[2 * i + 1]) / 2 - (o.E[0] + o.E[1]) / 2) / CM_PER_MEV; h += `<tr><td>${2 * i + 1}, ${2 * i + 2}</td><td>${e.toFixed(1)}</td><td>${((o.pct5d[2 * i] + o.pct5d[2 * i + 1]) / 2).toFixed(4)}</td></tr>`; }
  h += '</table></div></div>';
  const w = [];
  if (o.atEdge) w.push(`The target could not be reached inside ${o.lo.toFixed(2)}–${o.hi} eV, so the gap sits at the edge of the scan. Check the measured f or change the radial integrals.`);
  if (Math.max(...o.pct5d) > 5) w.push(`Some states have more than 5 % 5d character (max ${Math.max(...o.pct5d).toFixed(1)} %). The first-order mixing of SI eq. S16 is not reliable there; treat those numbers as qualitative.`);

function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function renderAll() {
  const r = S.res; if (!r) return;

  $('results').innerHTML = resultsHTML(r);
  $('stages').innerHTML = stagesHTML(r);

  renderAbs(); draw3D();
  $('dlJson').onclick = () => download('socf_results.json', JSON.stringify({ donors: S.env.map((u, i) => ({ label: u.label, el: u.el, r_A: u.r, charge: r.charges[i] })), targets_eV: r.targets, ground_target_meV: r.gs, a: r.a, rho: r.rho, ground_split_meV: r.summary.ground_split, excited_split_meV: r.summary.excited_split, transitions_eV: r.summary.transitions, residuals_meV: r.residuals, doublets_cm: r.summary.doublets, initial_charges: r.charges0, percent_error: r.pctErr, sampling: r.sampling ? { samples: r.sampling.n, accepted: r.sampling.accepted, skipped_at_bounds: r.sampling.atBounds, initial_cost: r.sampling.initialCost, best_cost: r.sampling.bestCost, improved: r.sampling.improved } : null, rotation: r.rotation.crude ? { crude: r.rotation.crude, fine: r.rotation.fine } : null, optics: r.optics ? { f_target: r.optics.fTarget, gap_eV: r.optics.gapEV, n_r: r.optics.nr, T_K: r.optics.T, radial_4f5d: r.optics.rfd, radial_5d: r.optics.r5d, transitions: r.optics.trans.map(t => ({ initial: [2 * t.I + 1, 2 * t.I + 2], final: [2 * t.F + 1, 2 * t.F + 2], E_eV: t.dE_eV, E1: t.E1, M1: t.M1, f: t.f, f_with_kBT: t.fT })), pct5d: r.optics.pct5d, gap_scan: r.optics.curve } : null }, null, 2), 'application/json');
  $('dlCsv').onclick = () => download('socf_results.csv', 'item,calc,expt\nground_split_meV,' + r.summary.ground_split + ',' + (r.gs ?? '') + '\nexcited_split_meV,' + r.summary.excited_split + ',' + (r.targets[1] != null ? (r.targets[1] - r.targets[0]) * 1000 : '') + '\nexcited_band_width_meV,' + r.summary.excited_total + ',' + (r.targets[2] != null ? (r.targets[2] - r.targets[0]) * 1000 : '') + '\n' + r.summary.transitions.map((v, i) => `E${['9_10', '11_12', '13_14'][i]}_eV,${v},${r.targets[i] ?? ''}`).join('\n') + '\n', 'text/csv');
}

/* ---------- events ---------- */
$('cif').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { S.cif = readCIF(await readText(f)); fillYb(); recomputeEnv(); setStatus('CIF read: ' + f.name + (S.env ? ` · ${S.env.length} donors` : '')); } catch (err) { setStatus('CIF error: ' + err.message, true); } };

<script type="text/plain" id="src2"><!DOCTYPE html>

<body>

<div class="layout">
<aside>
  <div class="panel">
    <h2>1. Sample</h2>
    <label for="solv">Solvent</label>
    <select id="solv"></select>
    <div class="row">
      <div><label for="nr">Refractive index n<sub>r</sub></label><input type="number" id="nr" step="0.001" value="1.406"></div>
      <div><label for="conc">Concentration (mM)</label><input type="number" id="conc" step="any" value="5.72666"></div>
    </div>
    <div class="row">
      <div><label for="plen">Path length L (cm)</label><input type="number" id="plen" step="any" value="1"></div>
      <div><label for="lam0">Peak wavelength (nm)</label><input type="number" id="lam0" step="any" value="981"></div>
    </div>

  </div>

  <div class="panel">
    <h2>2. Input</h2>
    <div class="tabs"><button class="tab on" id="tabS" type="button">From spectrum</button><button class="tab" id="tabM" type="button">From peak parameters</button></div>

    <div id="modeS">
      <label for="file">Absorption spectrum CSV (two columns: x, y)</label>
      <input type="file" id="file" accept=".csv,.txt,.dat">
      <div class="row">
        <div><label for="xunit">x axis unit</label>

      </div>
      <div class="hint">The window is centred on the peak wavelength above. Both a Lorentzian and a Gaussian are fitted inside it. The defaults (±6 nm, linear baseline) follow your MATLAB script.</div>
    </div>

    <div id="modeM" hidden>
      <div class="row">
        <div><label for="pk">Peak height</label><input type="number" id="pk" step="any" value="0.18"></div>
        <div><label for="mytype">Peak height is</label>

      </div>
      <div class="row">
        <div><label for="fw">FWHM</label><input type="number" id="fw" step="any" value="708.65"></div>

      </div>

  </div>
</aside>

<main>
  <div class="card" id="plotCard">
    <h2>Spectrum and fits</h2>

    <div class="legend" id="plotLegend"></div>
  </div>
  <div class="card">
    <h2>Results</h2>
    <div id="results"><div class="empty">No results yet.</div></div>
    <div class="toolbar"><button class="sec" id="dlCsv" type="button" disabled>Download results as CSV</button></div>
  </div>
  <div class="card formulas">
    <h2>How it is calculated</h2>
    <ol style="margin:0;padding-left:18px">
      <li>Absorption coefficient: <code>α = −ln(I<sub>out</sub>/I<sub>in</sub>)/L</code>. A log10 absorbance is multiplied by ln 10 first.</li>
      <li>The spectrum is converted to frequency (<code>ν = c/λ</code>) and fitted in the window with <code>α(ν) = A·g(ν; ν<sub>0</sub>, FWHM) + offset</code>. The Lorentzian is <code>g = (w/2)² / ((ν−ν<sub>0</sub>)² + (w/2)²)</code>. The Gaussian is <code>g = exp(−4 ln2 (ν−ν<sub>0</sub>)²/w²)</code>.</li>
      <li>Integral over angular frequency ω = 2πν: <code>∫α dω = 2π·A·(π/2)·w</code> (Lorentzian) or <code>2π·A·w·√(π/(4 ln2))</code> (Gaussian).</li>
      <li>Absorption cross section: <code>∫σ dω = ∫α dω / N</code>, with <code>N = c<sub>mM</sub> · N<sub>A</sub></code> molecules per m³ (1 mM = 1 mol/m³).</li>
      <li>Oscillator strength: <code>f<sub>12</sub> = (2ε<sub>0</sub> m c n<sub>r</sub> / (π e²)) · ∫σ dω</code>, the same prefactor as in your slides. SI units are used throughout.</li>
    </ol>
  </div>
</main>
</div>

<script>
const C = { eps0: 8.8541878128e-12, me: 9.1093837015e-31, c: 299792458, e: 1.602176634e-19, NA: 6.02214076e23, h: 6.62607015e-34 };
const THZ_PER_EV = 241.79892; // ν[THz] = E[eV] × 241.79892
const $ = id => document.getElementById(id);
const SOLVENTS = [['2-MeTHF', 1.406], ['THF', 1.407], ['Toluene', 1.497], ['Acetonitrile', 1.344], ['Dichloromethane', 1.424], ['Hexane', 1.375], ['Ethanol', 1.361], ['DMSO', 1.479], ['Water', 1.333], ['Custom', null]];

/* ---------- physics ---------- */
function prefactor(nr) { return 2 * C.eps0 * C.me * C.c * nr / (C.e * C.e * Math.PI); }          // m^-2 s
function density(cmM) { return cmM * C.NA; }                                                    // m^-3 (1 mM = 1 mol/m^3)
function oscillator(intAlphaDw, N, nr) { const sig = intAlphaDw / N; return { sigInt: sig, f: prefactor(nr) * sig }; }
const SHAPE_AREA = { lor: Math.PI / 2, gau: Math.sqrt(Math.PI / (4 * Math.LN2)) };             // area = A · w · factor
function shapeVal(kind, nu, nu0, w) { const d = nu - nu0; return kind === 'lor' ? (w * w / 4) / (d * d + w * w / 4) : Math.exp(-4 * Math.LN2 * d * d / (w * w)); }
function fwhmToTHz(v, unit, lam0nm) {
  const nu0 = C.c / (lam0nm * 1e-9) / 1e12;
  if (unit === 'ghz') return v / 1000;
  if (unit === 'thz') return v;
  if (unit === 'nm') return nu0 * v / lam0nm;
  if (unit === 'cm') return v * C.c * 100 / 1e12;
  if (unit === 'mev') return v / 1000 * THZ_PER_EV;
  return NaN;
}
function summarize(kind, A, nu0, wTHz, base, N, nr, L) {   // A in m^-1, nu0 and w in THz
  const wHz = wTHz * 1e12, intNu = A * SHAPE_AREA[kind] * wHz, intW = 2 * Math.PI * intNu, o = oscillator(intW, N, nr);
  const lam0 = C.c / (nu0 * 1e12) * 1e9;
  return { A, nu0, lam0, wTHz, wGHz: wTHz * 1e3, wNm: lam0 * wTHz / nu0, wCm: wHz / (C.c * 100), wMeV: wTHz / THZ_PER_EV * 1000,
    peakAL: A * L, epsilon: A / 100 / Math.LN10 / (N / C.NA / 1000), sigma0cm2: A / N * 1e4, intW, sigInt: o.sigInt, f: o.f, base };
}

/* ---------- parsing and fitting ---------- */
function parseSpectrum(text) {
  const x = [], y = [];
  text.split(/\r?\n/).forEach(l => { const p = l.trim().split(/[,\t;\s]+/).map(Number); if (p.length >= 2 && Number.isFinite(p[0]) && Number.isFinite(p[1])) { x.push(p[0]); y.push(p[1]); } });
  return { x, y };
}
function toTHz(x, unit) { return unit === 'nm' ? C.c / (x * 1e-9) / 1e12 : unit === 'ev' ? x * THZ_PER_EV : unit === 'cm' ? x * C.c * 100 / 1e12 : x; }
function solveSmall(M, v) {   // Gaussian elimination for a tiny symmetric system
  const n = v.length, A = M.map((r, i) => r.concat([v[i]]));
  for (let c = 0; c < n; c++) { let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r; if (Math.abs(A[p][c]) < 1e-30) return null; [A[c], A[p]] = [A[p], A[c]]; for (let r = 0; r < n; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let k = c; k <= n; k++) A[r][k] -= f * A[c][k]; } }
  return A.map((r, i) => r[n] / r[i]);
}
function innerFit(kind, nu, a, nu0, w, mode, ref) {   // mode 0: no baseline, 1: constant offset, 2: offset + slope (ν − ref)
  const n = nu.length, m = 1 + mode, M = Array.from({ length: m }, () => new Array(m).fill(0)), v = new Array(m).fill(0), row = new Array(m);
  for (let i = 0; i < n; i++) { row[0] = shapeVal(kind, nu[i], nu0, w); if (mode >= 1) row[1] = 1; if (mode >= 2) row[2] = nu[i] - ref; for (let r = 0; r < m; r++) { v[r] += row[r] * a[i]; for (let q = 0; q < m; q++) M[r][q] += row[r] * row[q]; } }
  const x = solveSmall(M, v); if (!x) return null;
  const A = x[0], c = mode >= 1 ? x[1] : 0, s = mode >= 2 ? x[2] : 0;
  let sse = 0; for (let i = 0; i < n; i++) { const r = a[i] - (A * shapeVal(kind, nu[i], nu0, w) + c + s * (nu[i] - ref)); sse += r * r; }

}

/* ---------- state and UI ---------- */
const S = { mode: 'S', data: null, res: null };
const fmtSci = (x, d = 4) => { if (!Number.isFinite(x)) return '—'; if (x === 0) return '0'; const [m, e] = x.toExponential(d).split('e'); return `${m}×10<sup>${parseInt(e, 10)}</sup>`; };
const fmtNum = (x, d = 4) => Number.isFinite(x) ? x.toFixed(d) : '—';
const setStatus = (t, err) => { const s = $('status'); s.textContent = t; s.className = 'status' + (err ? ' err' : ''); };
SOLVENTS.forEach(([n, v]) => { const o = document.createElement('option'); o.value = n; o.textContent = v ? `${n} (${v})` : n; $('solv').appendChild(o); });
$('solv').onchange = () => { const s = SOLVENTS.find(x => x[0] === $('solv').value); if (s && s[1]) $('nr').value = s[1]; };
$('nr').oninput = () => { const s = SOLVENTS.find(x => x[1] === parseFloat($('nr').value)); $('solv').value = s ? s[0] : 'Custom'; };
$('solv').value = '2-MeTHF';
function setMode(m) { S.mode = m; $('modeS').hidden = m !== 'S'; $('modeM').hidden = m !== 'M'; $('tabS').classList.toggle('on', m === 'S'); $('tabM').classList.toggle('on', m === 'M'); }
$('tabS').onclick = () => setMode('S'); $('tabM').onclick = () => setMode('M');
$('file').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { S.data = parseSpectrum(r.result); setStatus(S.data.x.length ? `Loaded ${S.data.x.length} points from ${f.name}.` : 'No numeric two-column data found in that file.', !S.data.x.length); }; r.readAsText(f); };

function readCommon() {
  const nr = parseFloat($('nr').value), conc = parseFloat($('conc').value), Lcm = parseFloat($('plen').value), lam0 = parseFloat($('lam0').value);
  if (![nr, conc, Lcm, lam0].every(v => Number.isFinite(v) && v > 0)) throw new Error('Enter positive values for refractive index, concentration, path length and peak wavelength.');
  return { nr, conc, L: Lcm / 100, lam0, N: density(conc) };
}
function runSpectrum(p) {
  if (!S.data || S.data.x.length < 8) throw new Error('Upload a spectrum CSV first.');
  const hw = parseFloat($('hw').value); if (!(hw > 0)) throw new Error('Enter a positive fit window.');
  const unit = $('xunit').value, k = $('ytype').value === 'log10' ? Math.LN10 : 1, withBase = parseInt($('base').value, 10);
  let pts = S.data.x.map((x, i) => ({ nu: toTHz(x, unit), al: S.data.y[i] * k / p.L })).filter(q => Number.isFinite(q.nu) && Number.isFinite(q.al)).sort((a, b) => a.nu - b.nu);
  const lo = C.c / ((p.lam0 + hw) * 1e-9) / 1e12, hi = C.c / ((p.lam0 - hw) * 1e-9) / 1e12;
  const win = pts.filter(q => q.nu >= lo && q.nu <= hi);
  if (win.length < 8) throw new Error(`Only ${win.length} points fall in the window. Check the x unit or widen the window.`);
  const nu = win.map(q => q.nu), al = win.map(q => q.al), nuG = C.c / (p.lam0 * 1e-9) / 1e12;
  const mn = Math.min(...al), mx = Math.max(...al), half = mn + (mx - mn) / 2, above = nu.filter((v, i) => al[i] >= half);
  const wG = above.length > 2 ? Math.max(above[above.length - 1] - above[0], (hi - lo) / 40) : (hi - lo) / 6;
  const out = { all: pts, win, lo, hi, nuG, withBase, ref: nuG };
  out.lor = fitLine('lor', nu, al, nuG, wG, withBase, nuG); out.gau = fitLine('gau', nu, al, nuG, wG, withBase, nuG);
  if (!out.lor || !out.gau) throw new Error('The fit did not converge. Check the peak wavelength and the window.');
  const bl = nu.map(v => (out.lor.c || 0) + (out.lor.s || 0) * (v - nuG)); let intN = 0; for (let i = 1; i < nu.length; i++) intN += 0.5 * ((al[i] - bl[i]) + (al[i - 1] - bl[i - 1])) * (nu[i] - nu[i - 1]) * 1e12;
  out.numInt = 2 * Math.PI * intN;
  out.sum = { lor: summarize('lor', out.lor.A, out.lor.nu0, out.lor.w, out.lor.c, p.N, p.nr, p.L), gau: summarize('gau', out.gau.A, out.gau.nu0, out.gau.w, out.gau.c, p.N, p.nr, p.L) };
  out.sum.lor.rmse = out.lor.rmse * p.L; out.sum.gau.rmse = out.gau.rmse * p.L; out.sum.lor.slope = out.lor.s; out.sum.gau.slope = out.gau.s; out.sum.lor.r2 = out.lor.r2; out.sum.gau.r2 = out.gau.r2;

function runManual(p) {
  const pk = parseFloat($('pk').value), fw = parseFloat($('fw').value); if (!(pk > 0 && fw > 0)) throw new Error('Enter a positive peak height and FWHM.');

function plotSVG(r, p) {
  const W = 760, H = 330, ml = 56, mr = 28, mt = 16, mb = 44, win = r.win, pad = (r.hi - r.lo) * 0.02;
  const x0 = r.lo - pad, x1 = r.hi + pad, ys = win.map(q => q.al * p.L), ymax = Math.max(...ys) * 1.12, ymin = Math.min(0, ...ys) * 1.1;

function resultsHTML(r, p) {
  const L = r.sum.lor, G = r.sum.gau, man = !!r.manual;
  const row = (name, a, b, key) => `<tr${key ? ' class="key"' : ''}><td>${name}</td><td>${a}</td><td>${b}</td></tr>`;
  let h = `<div class="tablewrap"><table><tr><th>Quantity</th><th>Lorentzian</th><th>Gaussian</th></tr>`;
  h += row('Oscillator strength f<sub>12</sub>', fmtSci(L.f), fmtSci(G.f), 1);
  h += row('∫σ(ω) dω (m² s⁻¹)', fmtSci(L.sigInt), fmtSci(G.sigInt), 1);
  h += row('FWHM (GHz)', fmtNum(L.wGHz, 2), fmtNum(G.wGHz, 2), 1);
  h += row('FWHM (nm)', fmtNum(L.wNm, 3), fmtNum(G.wNm, 3));
  h += row('FWHM (cm⁻¹)', fmtNum(L.wCm, 2), fmtNum(G.wCm, 2));
  h += row('FWHM (meV)', fmtNum(L.wMeV, 3), fmtNum(G.wMeV, 3));
  h += row('Centre ν<sub>0</sub> (THz)', fmtNum(L.nu0, 3), fmtNum(G.nu0, 3));
  h += row('Centre λ<sub>0</sub> (nm)', fmtNum(L.lam0, 2), fmtNum(G.lam0, 2));
  h += row('Peak α (m⁻¹)', fmtNum(L.A, 3), fmtNum(G.A, 3));
  h += row('Peak αL', fmtNum(L.peakAL, 4), fmtNum(G.peakAL, 4));
  h += row('Peak ε (M⁻¹ cm⁻¹)', fmtNum(L.epsilon, 2), fmtNum(G.epsilon, 2));
  h += row('Peak σ (cm²)', fmtSci(L.sigma0cm2), fmtSci(G.sigma0cm2));
  h += row('∫α(ω) dω (m⁻¹ s⁻¹)', fmtSci(L.intW), fmtSci(G.intW));
  if (!man) { h += row('Fit offset (m⁻¹)', fmtNum(L.base, 3), fmtNum(G.base, 3)); h += row('Fit baseline slope (m⁻¹ per THz)', fmtNum(L.slope, 3), fmtNum(G.slope, 3)); h += row('Fit RMSE (αL units)', fmtSci(L.rmse, 2), fmtSci(G.rmse, 2)); h += row('Fit R²', fmtNum(L.r2, 5), fmtNum(G.r2, 5)); h += row('Line-shape area inside the window', fmtNum(L.area, 1) + ' %', fmtNum(G.area, 1) + ' %'); }
  h += '</table></div>';
  if (!man) h += `<div class="hint" style="margin-top:10px">Numerical window integral (trapezoid on the data, offset removed, no extrapolation of the tails): ∫α dω = ${fmtSci(r.num.intW)} m⁻¹s⁻¹, ∫σ dω = ${fmtSci(r.num.sigInt)} m²s⁻¹, f<sub>12</sub> = ${fmtSci(r.num.f)}. The fitted values above integrate the whole line shape, so they are larger when the window area is below 100 %.</div>`;
  h += `<div class="hint">Constants: prefactor 2ε₀ m c n<sub>r</sub>/(e²π) = ${fmtSci(prefactor(p.nr))} m⁻² s, N = ${fmtSci(p.N)} m⁻³, L = ${p.L * 100} cm.</div>`;
  if (!man) {
    if (Math.abs(L.nu0 - r.nuG) > (r.hi - r.lo) / 4) h += '<div class="warn">The fitted centre is far from the peak wavelength you entered. Check that the peak and the window are right.</div>';
    if (L.rmse * p.L > 0.2 * L.peakAL) h += '<div class="warn">The fit residual is large compared with the peak. Try a narrower window or a different baseline setting.</div>';
    if ($('ytype').value === 'ln' && Math.max(...r.win.map(q => q.al * p.L)) > 3) h += '<div class="warn">The peak value is above 3 in −ln(T). If your instrument reports log10 absorbance, change the y axis setting.</div>';

  return h;
}

function csvOf(r, p) {
  const L = r.sum.lor, G = r.sum.gau, rows = [['quantity', 'lorentzian', 'gaussian'], ['f12', L.f, G.f], ['int_sigma_domega_m2_per_s', L.sigInt, G.sigInt], ['fwhm_GHz', L.wGHz, G.wGHz], ['fwhm_nm', L.wNm, G.wNm], ['fwhm_cm-1', L.wCm, G.wCm], ['fwhm_meV', L.wMeV, G.wMeV], ['center_THz', L.nu0, G.nu0], ['center_nm', L.lam0, G.lam0], ['peak_alpha_per_m', L.A, G.A], ['peak_epsilon_M-1cm-1', L.epsilon, G.epsilon], ['peak_sigma_cm2', L.sigma0cm2, G.sigma0cm2], ['fit_r2', L.r2 ?? '', G.r2 ?? ''], ['area_in_window_pct', L.area ?? '', G.area ?? ''], ['int_alpha_domega', L.intW, G.intW], ['n_r', p.nr, p.nr], ['concentration_mM', p.conc, p.conc], ['path_length_m', p.L, p.L]];

}

$('run').onclick = () => {
  try {
    const p = readCommon(), r = S.mode === 'S' ? runSpectrum(p) : runManual(p);
    S.res = { r, p };
    $('results').innerHTML = resultsHTML(r, p);
    if (r.manual) { $('plot').innerHTML = '<div class="empty">No spectrum plot in "From peak parameters" mode.</div>'; $('plotLegend').innerHTML = ''; }
    else { $('plot').innerHTML = plotSVG(r, p); $('plotLegend').innerHTML = '<span class="dot" style="background:#2f6fed"></span>Data in window<span class="dot" style="background:#d63c2f"></span>Lorentzian fit<span class="dot" style="background:#17734a"></span>Gaussian fit<span class="dot" style="background:#7a3fa0"></span>Entered peak wavelength (dashed)'; }
    $('dlCsv').disabled = false; setStatus('Done');
  } catch (e) { setStatus(e.message, true); }
};
$('dlCsv').onclick = () => { if (!S.res) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csvOf(S.res.r, S.res.p)], { type: 'text/csv' })); a.download = 'oscillator_strength.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
<\/script>

<script>
const F = [document.getElementById('f1'), document.getElementById('f2')], B = [document.getElementById('b1'), document.getElementById('b2')];
F[0].srcdoc = document.getElementById('src1').textContent.replace(/<\\\/script/g, '</script');
F[1].srcdoc = document.getElementById('src2').textContent.replace(/<\\\/script/g, '</script');
function fit(f) { try { const d = f.contentDocument; if (!d || !d.body) return; const h = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight); if (h > 0 && Math.abs(f.offsetHeight - h) > 2) f.style.height = h + 'px'; } catch (e) {} }
function show(i) { F.forEach((f, k) => { f.hidden = k !== i; B[k].classList.toggle('on', k === i); }); fit(F[i]); try { F[i].contentWindow.dispatchEvent(new Event('resize')); } catch (e) {} }
B.forEach((b, i) => b.onclick = () => show(i));
setInterval(() => F.forEach(f => { if (!f.hidden) fit(f); }), 400);
F.forEach(f => f.onload = () => fit(f));
</script>
